services:
  - type: web
    name: responsive-task-manager-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn task_manager.wsgi:application
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: responsive-task-manager-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://responsive-task-manager-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: responsive-task-manager-db
          property: connectionString

  - type: web
    name: responsive-task-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://responsive-task-manager-api.onrender.com/api

databases:
  - name: responsive-task-manager-db
    plan: free
    region: singapore
    databaseName: task_manager
    user: task_manager_user
